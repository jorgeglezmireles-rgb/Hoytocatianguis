<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tianguis reportado por la comunidad | Hoy toca tianguis</title>
<meta name="description" content="Tianguis de la Ciudad de México reportado por la comunidad de Hoy toca tianguis: días, horario, calles y recomendaciones de puestos.">
<meta name="theme-color" content="#FBF7F0">

<meta property="og:title" content="Tianguis reportado por la comunidad | Hoy toca tianguis">
<meta property="og:description" content="Un tianguis que no estaba en los datos oficiales y que la comunidad agregó al mapa.">
<meta property="og:image" content="https://hoytocatianguis.com/og.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@GlezMireles">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/static/paginas.css?v=1">
<style>.nota{margin:12px 0 0;padding:12px 14px;border-left:4px solid #C85A32;background:#fff;border-radius:8px}.nota p{margin:0}.nota .small{margin-top:6px}</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/static/logo96.webp" width="40" height="40" alt=""><span>Hoy toca tianguis</span></a>
  <a class="btn btn-map" href="/">Abrir el mapa</a>
</header>
<main class="wrap" id="app">
  <p class="lead" id="cargando">Cargando el tianguis…</p>
</main>
<footer class="foot">
  <nav aria-label="Más páginas"><a href="/">Mapa</a><a href="/hoy/">Tianguis de hoy</a><a href="/tianguis/">Todos por alcaldía</a><a href="/datos.html">Datos</a><a href="/terminos.html">Términos</a><a href="/privacidad.html">Privacidad</a></nav>
  <p>Tianguis reportado por la comunidad y revisado antes de publicarse. Aportaciones bajo CC BY-SA 4.0. Mapa base © colaboradores de OpenStreetMap.</p>
</footer>
<script>
(function () {
  var SB = 'https://ozygcsqqbuenkqvehrsg.supabase.co', KEY = 'sb_publishable_RxjU9aHhNWpuWi3Jm9AbMQ_tMTjTZxI';
  var DAYS = [['Lunes', '#1D5B79'], ['Martes', '#C85A32'], ['Miércoles', '#3A6B4C'], ['Jueves', '#D99B26'], ['Viernes', '#8C3B2B'], ['Sábado', '#2E6F73'], ['Domingo', '#B8332A']];
  var PUESTOS = { 20: 'Menos de 30 puestos', 60: 'Entre 30 y 100 puestos', 200: 'Entre 100 y 300 puestos', 450: 'Más de 300 puestos' };
  var SMALL = ['de', 'del', 'la', 'las', 'los', 'el', 'y', 'en'];
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var tc = function (s) { return String(s || '').toLowerCase().replace(/(^|[\s(./-])([a-záéíóúñü])/g, function (m, a, b) { return a + b.toUpperCase(); }).split(' ').map(function (w, i) { return i > 0 && SMALL.indexOf(w.toLowerCase()) >= 0 ? w.toLowerCase() : w; }).join(' '); };
  var app = document.getElementById('app');
  var id = (new URLSearchParams(location.search).get('id') || '').trim();
  function noEsta() {
    app.innerHTML = '<header class="head"><h1>No encontramos este tianguis</h1><p class="lead">Puede que todavía esté en revisión o que la liga esté incompleta.</p></header><div class="actions"><a class="btn btn-primary" href="/">Abrir el mapa</a><a class="btn" href="/tianguis/">Todos por alcaldía</a></div>';
    var m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex'; document.head.appendChild(m);
  }
  if (!/^[0-9a-f-]{36}$/i.test(id)) return noEsta();
  fetch(SB + '/rest/v1/tianguis_comunidad?select=*&id=eq.' + id, { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (rows) {
      var t = rows && rows[0]; if (!t) return noEsta();
      var dias = DAYS.filter(function (d, i) { return t.dias & (1 << i); });
      var diasTxt = dias.length === 7 ? 'todos los días' : dias.map(function (d) { var w = d[0].toLowerCase(); return /s$/.test(w) ? w : w + 's'; }).join(', ').replace(/, ([^,]*)$/, ' y $1');
      var nombre = t.nombre || ('Tianguis ' + tc(t.colonia || t.calle));
      var alc = tc(t.alcaldia), col = t.colonia ? tc(t.colonia) : '';
      var calles = t.calle + (t.entre1 ? ' entre ' + t.entre1 + (t.entre2 ? ' y ' + t.entre2 : '') : '');
      var horario = t.hora_inicio + '–' + t.hora_fin;
      var mapa = '/?t=com-' + t.id, url = 'https://hoytocatianguis.com/tianguis/comunidad/?id=' + t.id;
      var desc = nombre + ' se pone ' + (dias.length === 7 ? 'todos los días' : 'los ' + diasTxt) + ' de ' + t.hora_inicio + ' a ' + t.hora_fin + ' en ' + calles + (col ? ', colonia ' + col : '') + ', ' + alc + '. Reportado por la comunidad.';
      document.title = nombre + ' · ' + alc + ' | Hoy toca tianguis';
      [['meta[name="description"]', desc], ['meta[property="og:title"]', document.title], ['meta[property="og:description"]', desc]].forEach(function (x) { var e = document.querySelector(x[0]); if (e) e.setAttribute('content', x[1]); });
      var can = document.createElement('link'); can.rel = 'canonical'; can.href = url; document.head.appendChild(can);
      var ld = document.createElement('script'); ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'Place', name: nombre, description: desc, url: url,
        address: { '@type': 'PostalAddress', streetAddress: calles, addressLocality: (col ? col + ', ' : '') + alc, addressRegion: 'Ciudad de México', addressCountry: 'MX' },
        geo: { '@type': 'GeoCoordinates', latitude: t.lat, longitude: t.lng }, isAccessibleForFree: true, publicAccess: true, hasMap: 'https://hoytocatianguis.com' + mapa });
      document.head.appendChild(ld);
      var info = [['Días', dias.map(function (d) { return d[0]; }).join(', ')], ['Horario', horario], ['Calles', calles], ['Colonia', col], ['Alcaldía', alc],
        ['Puestos', PUESTOS[t.puestos] || ''], ['Giro', t.giro ? tc(t.giro) : '']].filter(function (x) { return x[1]; });
      app.innerHTML =
        '<nav class="crumbs" aria-label="Ruta"><a href="/">Inicio</a> <span aria-hidden="true">›</span> <a href="/tianguis/">Tianguis</a> <span aria-hidden="true">›</span> <span aria-current="page">' + esc(nombre) + '</span></nav>' +
        '<header class="head"><p class="kicker">' + dias.map(function (d) { return '<span class="day" style="--c:' + d[1] + '">' + d[0] + '</span>'; }).join(' ') + '</p><h1>' + esc(nombre) + '</h1>' +
        '<p class="lead">Se pone <b>' + esc(dias.length === 7 ? 'todos los días' : 'los ' + diasTxt) + '</b>, de ' + esc(t.hora_inicio) + ' a ' + esc(t.hora_fin) + (col ? ', en la colonia ' + esc(col) : '') + ', alcaldía ' + esc(alc) + '.</p></header>' +
        '<div class="actions"><a class="btn btn-primary" href="' + mapa + '">Ver en el mapa</a><a class="btn" href="https://www.google.com/maps/dir/?api=1&amp;destination=' + t.lat + ',' + t.lng + '" rel="noopener" target="_blank">Cómo llegar</a></div>' +
        '<section class="block"><h2 class="sr-only">Datos del tianguis</h2><dl class="info">' + info.map(function (x) { return '<div><dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd></div>'; }).join('') + '</dl>' +
        (t.comentario ? '<div class="nota"><p>“' + esc(t.comentario) + '”</p><p class="small">Nota de quien lo reportó</p></div>' : '') +
        '<p class="small">📣 Reportado por <b>' + esc(t.alias || 'una persona registrada') + '</b> y revisado antes de publicarse. No viene de los datos oficiales de la ADIP. ¿Algo cambió? <a href="' + mapa + '">Corrígelo en el mapa</a>.</p></section>' +
        '<section class="block" aria-labelledby="h-rec"><h2 id="h-rec">Puestos recomendados</h2><ul class="hz" data-hallazgos="com-' + esc(t.id) + '" data-static="0"></ul>' +
        '<p class="empty" data-empty>Todavía nadie ha recomendado un puesto aquí. ¿Conoces uno bueno? Sé el primero.</p><p><a class="btn" href="' + mapa + '">Recomendar un puesto</a></p></section>';
      var s = document.createElement('script'); s.src = '/static/paginas.js?v=2'; s.defer = true; document.body.appendChild(s);
    })
    .catch(function () { app.innerHTML = '<header class="head"><h1>No se pudo cargar</h1><p class="lead">Revisa tu conexión e inténtalo de nuevo.</p></header><div class="actions"><a class="btn btn-primary" href="/">Abrir el mapa</a></div>'; });
})();
</script>

</body>
</html>
